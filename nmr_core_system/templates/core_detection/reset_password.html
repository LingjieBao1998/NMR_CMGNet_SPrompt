{% extends 'core_detection/base.html' %}

{% block title %}Reset Password - AI-Powered Quinolone Detection System{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-5 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4 class="text-white mb-0" data-i18n="reset_password_header">🔒 Set New Password</h4>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="password1" class="form-label" style="font-weight: 600;" data-i18n="new_password">🔒 New Password</label>
                        <input type="password" class="form-control enhanced-input" id="password1" name="password1"
                               required minlength="8" autofocus
                               data-i18n-placeholder="password_placeholder" placeholder="At least 8 characters">
                    </div>

                    <div class="mb-3">
                        <label for="password2" class="form-label" style="font-weight: 600;" data-i18n="confirm_password">🔒 Confirm Password</label>
                        <input type="password" class="form-control enhanced-input" id="password2" name="password2"
                               required minlength="8"
                               data-i18n-placeholder="confirm_password_placeholder" placeholder="Repeat your password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="submit_mol_button">
                            <i class="bi bi-check2-circle"></i> <span data-i18n="reset_password_button">Reset Password</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
